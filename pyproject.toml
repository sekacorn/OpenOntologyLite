[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openontologylite"
version = "0.1.0a2"
description = "A lightweight, vendor-neutral semantic layer for portable organizational knowledge."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "sekacorn" }]
keywords = ["ontology", "semantic-layer", "ai", "metadata", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0.1,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.9",
    "build>=1.2",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0.12",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/sekacorn/OpenOntologyLite"
Repository = "https://github.com/sekacorn/OpenOntologyLite"
Issues = "https://github.com/sekacorn/OpenOntologyLite/issues"
Documentation = "https://github.com/sekacorn/OpenOntologyLite/tree/main/docs"

[project.scripts]
openontology = "open_ontology_lite.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/open_ontology_lite"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/CHANGELOG.md",
    "/MANIFEST.in",
    "/pyproject.toml",
]
exclude = ["/dist", "/build", "/.venv", "/.pytest_cache", "/.ruff_cache", "/.mypy_cache"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["open_ontology_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=open_ontology_lite --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["open_ontology_lite"]

[tool.bandit]
exclude_dirs = ["tests"]
