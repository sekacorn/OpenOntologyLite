schema_version: "1.0"
ontology: {id: customer-service, name: Customer Service Ontology, version: "1.1.0", namespace: example.customer_service}
entities:
  Customer:
    properties:
      customer_id: {type: string, required: true}
      account_status: {type: string, required: true, enum: [active, suspended]}
      email: {type: string}
  Invoice:
    properties:
      invoice_id: {type: string, required: true}
      amount: {type: decimal, required: true, minimum: 1}
      currency: {type: string, required: true}
relationships: []
permissions: {}
actions: []
