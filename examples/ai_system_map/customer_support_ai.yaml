schema_version: "1.0"

system:
  name: Customer Support AI
  purpose: Route customer-support workloads according to risk, review, audit, and cost controls.
  owner_label: Customer Support Operations
  risk_profile: medium
  environment: reference
  notes: This fictional example documents intended behavior and does not represent a live deployment.

entities:
  - name: SupportTicket
    description: A support request and its operational status.
    sensitivity: confidential
    fields:
      - ticket_reference
      - category
      - status
      - message_text
  - name: CustomerAccount
    description: The minimum account context needed to handle a request.
    sensitivity: restricted
    fields:
      - account_reference
      - service_tier
      - region
  - name: SupportResponse
    description: A proposed or approved response to a customer.
    sensitivity: confidential
    fields:
      - response_text
      - disposition
      - reviewer_status
  - name: EscalationRecord
    description: A record of why automation stopped and where the request was sent.
    sensitivity: confidential
    fields:
      - escalation_type
      - reason
      - status

model_routes:
  - name: candidate_model
    description: Evaluate a candidate model for permitted tasks under declared controls.
  - name: baseline_model
    description: Use the established baseline model path.
  - name: human_review
    description: Send work to an authorized support reviewer.
  - name: blocked_or_escalate
    description: Block automated handling or use a declared escalation path.

escalation_paths:
  - name: human_review
    description: Authorized human review.
  - name: security_review
    description: Security response review.
  - name: legal_review
    description: Qualified legal review.
  - name: compliance_review
    description: Compliance review.
  - name: do_not_answer
    description: Do not generate an answer.
  - name: baseline_model_only
    description: Keep the task on the established baseline path.

tasks:
  - name: PasswordReset
    description: Draft documented password-reset guidance without changing an account.
    category: account-access
    risk_level: low
    customer_facing: true
    allowed_routes: [candidate_model, baseline_model]
    related_entities: [SupportTicket, CustomerAccount, SupportResponse]
    policy_tags: [approved-knowledge-only, no-account-change]
    expected_audit_events: [route_selected, guidance_drafted]
    expected_metrics: [input_tokens, output_tokens, estimated_cost, resolution_outcome]
    data_sources: [approved support knowledge]
    retrieval_boundaries: [password-reset articles only]
    models: [candidate support model, baseline support model]
    agent_roles: [support assistant]
    tool_access: [knowledge search]
    ontology_entities: [SupportTicket]
    ontology_actions: [create_ticket]
    ontology_permissions: [support.ticket.create]
    data_handling_expectations: [Use only the minimum fictional account context.]
    known_failure_modes: [Outdated guidance may require operator review.]
    data_retention: Follow the support ticket retention policy.
    provenance: {example: fictional customer-support map}

  - name: InternalSummary
    description: Summarize a support request for an operator.
    category: support
    risk_level: low
    customer_facing: false
    allowed_routes: [candidate_model, baseline_model]
    related_entities: [SupportTicket]
    policy_tags: [minimum-context, operator-assistance]
    expected_audit_events: [route_selected, summary_generated]
    expected_metrics: [input_tokens, output_tokens, estimated_cost, operator_outcome]
    data_handling_expectations: [Use only the support details needed for the operator summary.]

  - name: RefundRequest
    description: Prepare a refund request for baseline handling and required human review.
    category: refund
    risk_level: medium
    customer_facing: true
    allowed_routes: [baseline_model, human_review]
    human_review_required: true
    escalation: [human_review]
    related_entities: [SupportTicket, CustomerAccount, SupportResponse]
    policy_tags: [human-action-required, refund-control]
    expected_audit_events: [route_selected, review_requested, refund_disposition]
    expected_metrics: [input_tokens, output_tokens, estimated_cost, refund_outcome]
    data_handling_expectations: [Limit refund context to the ticket, account, and authorized reviewer.]

  - name: BillingFAQ
    description: Answer a documented billing FAQ without changing an account or making a financial decision.
    category: billing-faq
    risk_level: medium
    customer_facing: true
    allowed_routes: [candidate_model, baseline_model, human_review]
    related_entities: [SupportTicket, SupportResponse]
    policy_tags: [approved-knowledge-only, no-account-change]
    expected_audit_events: [route_selected, answer_drafted, knowledge_reference_used]
    expected_metrics: [input_tokens, output_tokens, estimated_cost, resolution_outcome]
    data_handling_expectations: [Use only the ticket context needed to answer the approved FAQ.]

  - name: AccountCancellation
    description: Prepare an account cancellation request for required human action.
    category: account-change
    risk_level: medium
    customer_facing: true
    allowed_routes: [baseline_model, human_review]
    human_review_required: true
    escalation: [human_review]
    related_entities: [SupportTicket, CustomerAccount, EscalationRecord]
    policy_tags: [human-action-required]
    expected_audit_events: [route_selected, review_requested, account_action_disposition]
    expected_metrics: [input_tokens, output_tokens, estimated_cost, cancellation_outcome]
    data_handling_expectations: [Restrict account details to the cancellation review workflow.]

  - name: AngryCustomerEscalation
    description: Recognize an escalation request and route it to a supervisor.
    category: support-escalation
    risk_level: high
    customer_facing: true
    allowed_routes: [human_review, baseline_model]
    human_review_required: true
    escalation: [human_review]
    related_entities: [SupportTicket, EscalationRecord]
    policy_tags: [de-escalation, no-autonomous-resolution]
    expected_audit_events: [route_selected, escalation_created, reviewer_disposition]
    expected_metrics: [input_tokens, output_tokens, estimated_cost, escalation_outcome]
    data_handling_expectations: [Share only the ticket context needed by the assigned reviewer.]

  - name: SecurityConcern
    description: Stop ordinary automation and route potential security incidents for review.
    category: security
    risk_level: high
    customer_facing: true
    allowed_routes: [human_review, blocked_or_escalate]
    human_review_required: true
    escalation: [security_review]
    related_entities: [SupportTicket, EscalationRecord]
    policy_tags: [security-response, minimum-context]
    expected_audit_events: [route_selected, security_escalation_created, reviewer_disposition]
    expected_metrics: [input_tokens, output_tokens, estimated_cost, escalation_outcome]
    data_handling_expectations:
      - Minimize account details and send incident context only to the security review path.
    deployment_restrictions: [No autonomous incident response.]
    human_review_points: [Security reviewer disposition.]

  - name: LegalQuestion
    description: Block automated legal advice and route the question for qualified review.
    category: legal
    risk_level: regulated
    customer_facing: true
    allowed_routes: [blocked_or_escalate]
    human_review_required: true
    escalation: [legal_review]
    related_entities: [SupportTicket, EscalationRecord]
    policy_tags: [no-legal-advice]
    expected_audit_events: [route_selected, legal_escalation_created]
    expected_metrics: [input_tokens, output_tokens, estimated_cost, escalation_outcome]
    data_handling_expectations:
      - Minimize customer context and restrict access to the qualified legal review path.
    geographic_restrictions: [Apply the deployment jurisdiction policy.]
    human_review_points: [Qualified legal review.]

  - name: MedicalQuestion
    description: Block automated medical advice and route the question for qualified review.
    category: medical
    risk_level: regulated
    customer_facing: true
    allowed_routes: [blocked_or_escalate]
    human_review_required: true
    escalation: [do_not_answer]
    related_entities: [SupportTicket, EscalationRecord]
    policy_tags: [no-medical-advice]
    expected_audit_events: [route_selected, medical_escalation_created]
    expected_metrics: [input_tokens, output_tokens, estimated_cost, escalation_outcome]
    data_handling_expectations:
      - Do not retain health details beyond the controlled support record.
    deployment_restrictions: [No automated medical advice.]
    human_review_points: [Qualified review or do-not-answer disposition.]

  - name: FinancialQuestion
    description: Block automated financial advice and route the request for qualified review.
    category: financial
    risk_level: regulated
    customer_facing: true
    allowed_routes: [blocked_or_escalate]
    human_review_required: true
    escalation: [compliance_review]
    related_entities: [SupportTicket, EscalationRecord]
    policy_tags: [no-financial-advice]
    expected_audit_events: [route_selected, financial_escalation_created]
    expected_metrics: [input_tokens, output_tokens, estimated_cost, escalation_outcome]
    data_handling_expectations:
      - Minimize financial context and restrict it to the compliance review path.
    deployment_restrictions: [No automated financial advice.]
    human_review_points: [Compliance reviewer disposition.]

integrations:
  - tool: ModelSwapBench
    meaning: Compare candidate and baseline model behavior for declared tasks.
  - tool: AgentPolicyPack
    meaning: Represent policy checks associated with task and route decisions.
  - tool: AIAuditLog
    meaning: Record route selection, review, escalation, and disposition events.
  - tool: AIMeter OSS
    meaning: Track declared token and estimated cost metrics.
  - tool: PrivateAIStack
    meaning: Represent a self-hosted execution option where deployment policy permits.
  - tool: AgentForge
    meaning: Represent an orchestration layer that consumes the portable map.

limitations:
  - This map provides documentation and validation support, not compliance certification.
  - This map does not prove that a workflow is safe.
  - This map does not replace human review for high-risk uses.
  - This map does not prove legal, regulatory, safety, or security compliance.
  - This map does not guarantee model behavior.
  - This map does not enforce policy unless connected to enforcement systems.
  - Integration entries describe portable meaning and integration patterns, not verified live integrations.
  - The example uses fictional labels and contains no real customer data.
