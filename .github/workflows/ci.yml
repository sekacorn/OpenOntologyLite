name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --strict src
      - run: python -m pytest
      - run: python -m bandit -r src
      - run: python -m pip_audit
      - run: rm -rf dist build
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Clean wheel install smoke test
        run: |
          python -m venv /tmp/openontologylite-wheel-smoke
          /tmp/openontologylite-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/openontologylite-wheel-smoke/bin/python -m pip install dist/openontologylite-*.whl
          /tmp/openontologylite-wheel-smoke/bin/python -c "import open_ontology_lite; print(open_ontology_lite.__version__)"
          /tmp/openontologylite-wheel-smoke/bin/openontology --help
