name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --strict src
      - run: python -m pytest
      - run: python -m bandit -r src
      - run: python -m pip_audit
      - run: rm -rf dist build
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Clean wheel install smoke test
        run: |
          python -m venv /tmp/openontologylite-wheel-smoke
          /tmp/openontologylite-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/openontologylite-wheel-smoke/bin/python -m pip install dist/openontologylite-*.whl
          /tmp/openontologylite-wheel-smoke/bin/python -c "import open_ontology_lite; print(open_ontology_lite.__version__)"
          /tmp/openontologylite-wheel-smoke/bin/openontology --help
