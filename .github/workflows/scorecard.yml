name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "31 3 * * 2"
  push:
    branches: [main]
  # So the scan can be run on demand. Without this the only ways to trigger
  # it are the weekly cron, a push to the default branch, or a branch
  # protection change, which makes a fix impossible to verify promptly.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
