name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --strict src
      - run: python -m pytest
      - run: python -m bandit -r src
      - run: python -m pip_audit

  build:
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Validate tag matches package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}; expected {expected_tag!r}.")
          print(f"Validated tag {tag} matches package version {version}.")
          PY
      - run: python -m pip install --upgrade pip build twine
      - run: rm -rf dist build
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Validate expected artifacts
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected = {
              f"openontologylite-{version}-py3-none-any.whl",
              f"openontologylite-{version}.tar.gz",
          }
          actual = {path.name for path in pathlib.Path("dist").iterdir()}
          missing = expected - actual
          if missing:
              raise SystemExit(f"Missing expected artifacts: {sorted(missing)}; found {sorted(actual)}")
          print(f"Found expected artifacts: {sorted(expected)}")
          PY
      - name: Clean wheel install smoke test
        run: |
          python -m venv /tmp/openontologylite-wheel-smoke
          /tmp/openontologylite-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/openontologylite-wheel-smoke/bin/python -m pip install dist/openontologylite-*.whl
          /tmp/openontologylite-wheel-smoke/bin/python -c "from importlib.metadata import version; print(version('openontologylite'))"
          /tmp/openontologylite-wheel-smoke/bin/openontology --help
          /tmp/openontologylite-wheel-smoke/bin/openontology ai-map --help
          /tmp/openontologylite-wheel-smoke/bin/openontology ai-map validate examples/ai_system_map/customer_support_ai.yaml --strict
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
